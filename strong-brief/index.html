<style id="app-style">
/* Layout: single phone-first column, sticky brief header, five-tab dock at the bottom. */

  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

}

  color-scheme:dark;
  --bg:#0e1017; --surface:#171a24; --surface-2:#1e2230; --ink:#eef0f7; --ink-2:#b5bacd; --muted:#7f869c;
  --line:#2a2e3d; --border:rgba(255,255,255,.09);
  --accent:#8291ff; --accent-ink:#0e1017; --accent-wash:rgba(130,145,255,.16);
  --mark:#e6c640; --mark-ink:#16140a;
  --good:#3fcf80; --good-wash:rgba(63,207,128,.15); --warn:#e0a640; --crit:#f07070; --crit-wash:rgba(240,112,112,.14);
  --m-back:#8291ff; --m-legs:#f0904a; --m-push:#c48ff0; --m-core:#3fc9b9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1017; --surface:#171a24; --surface-2:#1e2230; --ink:#eef0f7; --ink-2:#b5bacd; --muted:#7f869c;
  --line:#2a2e3d; --border:rgba(255,255,255,.09);

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#root{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}

.brand b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.brand b span{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 2px}
.brand small{font-size:.74rem;color:var(--muted);margin-top:3px}
.sync{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.ro{background:var(--crit)} .dot.busy{background:var(--warn)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:680px;margin:0 auto;display:flex;padding:6px 8px}
.tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:10px;color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.02em}
.tab svg.i{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab:active{background:var(--surface-2)}

/* date nav */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}
.datelab{flex:1;text-align:center;position:relative;min-width:0}
.datelab .d1{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.datelab .d2{font-size:.75rem;color:var(--muted)}
.datelab input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.pill{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-wash);color:var(--accent);vertical-align:2px;margin-left:6px}
.pill.mark{background:var(--mark);color:var(--mark-ink)}

/* session head */
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shead{margin-bottom:14px}
.shead h1{font-size:1.65rem;font-weight:800;margin-top:4px;line-height:1.15}
.shead p{margin:6px 0 0;color:var(--ink-2);font-size:.9rem;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.73rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--ink-2)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}

.sec-title small{font-family:var(--f-body);font-weight:500;font-size:.76rem;color:var(--muted)}
details.how summary{cursor:pointer;list-style:none;font-size:.78rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:4px}

.warm{display:flex;flex-direction:column;gap:6px}
.warm summary{font-weight:600;font-size:.9rem;cursor:pointer}
.warm ol{margin:8px 0 0;padding-left:20px;font-size:.86rem;color:var(--ink-2)}

/* exercise card */
.ex.done{border-color:var(--good)}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exh h3{font-size:1.05rem;font-weight:700;line-height:1.25}
.exmeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:.75rem;color:var(--ink-2);align-items:center}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

.last{display:flex;gap:8px;align-items:center;margin:10px 0 0;padding:7px 10px;background:var(--surface-2);border-radius:10px;font-size:.78rem;color:var(--ink-2);flex-wrap:wrap}
.last .num{color:var(--ink);font-weight:500}
.last .when{margin-left:auto;color:var(--muted);font-size:.72rem}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-wash);color:var(--accent)}
.hint.up{background:var(--mark);color:var(--mark-ink)}

.sets{display:flex;flex-direction:column;gap:7px;margin-top:12px}

.srow .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:center}
.fld{position:relative}

.fld input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 8px 9px;text-align:center;font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--ink-2)}
.btn.good{background:var(--good);color:#fff}
.btn.crit{background:var(--crit);color:#fff}
.btn.wide{width:100%}
.btn.sm{padding:7px 12px;font-size:.78rem;border-radius:9px}
.btn:active{opacity:.85}

.finish{margin-top:16px;text-align:center}
.won{display:flex;gap:12px;align-items:center}
.won .big{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.won .big span{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px}
.won p{margin:2px 0 0;font-size:.84rem;color:var(--ink-2)}
.badge{width:44px;height:44px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.badge svg.i{width:24px;height:24px;stroke-width:2.4}

.rest-day{text-align:left}
.rest-day h2{font-size:1.25rem;font-weight:800}
.todo{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--ink-2)}
.todo li b{color:var(--ink);font-weight:600}
.todo .tick{width:22px;height:22px;border-radius:7px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;flex:none;font-size:.7rem;font-weight:700;font-family:var(--f-mono)}

/* rest timer */
.timer{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:.85rem;font-weight:600}
.timer .num{font-size:1.05rem}
.timer button{background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:5px 12px;font-size:.76rem;font-weight:700}
.timer.zero{background:var(--good);color:#fff}
.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.8rem;font-weight:600;box-shadow:var(--shadow)}

/* meals */
.macro{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbar .lab{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-2);margin-bottom:5px}

.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}

.meal{display:flex;flex-direction:column;gap:8px}
.meal.ate{border-color:var(--good)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mh .slot{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mh h3{font-size:1rem;font-weight:700;margin-top:2px}
.mstats{display:flex;gap:12px;font-size:.76rem;color:var(--ink-2);flex-wrap:wrap}
.mstats b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.mfoot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mfoot select{flex:1;min-width:0;max-width:240px;border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:7px 8px;font-size:.78rem;color:var(--ink-2)}
.ing{margin:6px 0 0;padding-left:18px;font-size:.83rem;color:var(--ink-2)}
.groc{columns:2 220px;column-gap:18px}
.groc .g{break-inside:avoid;margin-bottom:12px}
.groc h4{margin:0 0 4px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.groc ul{list-style:none;margin:0;padding:0;font-size:.85rem}
.groc li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.groc li span.num{color:var(--muted);font-size:.75rem}

.bigin{display:flex;align-items:baseline;gap:8px}
.bigin input{font-family:var(--f-display);font-weight:800;font-size:2.6rem;border:0;background:none;width:100%;max-width:170px;padding:0;font-variant-numeric:tabular-nums}
.bigin input:focus{outline:none;box-shadow:0 2px 0 var(--accent)}

.list{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)}

.chart{width:100%;height:auto;display:block}

.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.board .w.cur{color:var(--accent);font-weight:700}
select.pick{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:10px 12px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}

.phases{display:flex;gap:3px;margin-top:10px}

.phleg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.phleg div{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:.84rem;color:var(--ink-2)}
.phleg b{font-family:var(--f-mono);font-size:.74rem;color:var(--ink);font-weight:600}
.split{display:flex;flex-direction:column}
.split details{border-bottom:1px solid var(--line);padding:10px 0}

.split summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
.split summary::-webkit-details-marker{display:none}
.split summary b{font-family:var(--f-mono);font-size:.74rem;color:var(--accent);width:34px;flex:none}
.split summary span{font-weight:600}
.split ul{margin:6px 0 0 44px;padding:0;font-size:.84rem;color:var(--ink-2)}
.prose{font-size:.88rem;color:var(--ink-2)}
.prose p{margin:0 0 8px}
.prose ul{margin:0;padding-left:18px}
.prose li{margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:600;color:var(--muted)}
.form input{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:9px 10px;font-size:.9rem;color:var(--ink);font-weight:500}
.form .full{grid-column:1/-1}
textarea.bk{width:100%;min-height:90px;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px;font-family:var(--f-mono);font-size:.72rem}
.note{font-size:.74rem;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.chk,.card,.btn{transition:background-color .15s,border-color .15s,opacity .15s}}
</style>

function dayIndex(s){return diff(state.settings.startDate,s);} /* 0 = day 1 */
function weekOf(s){var i=dayIndex(s);return i<0?0:Math.floor(i/7)+1;}
function phaseOf(week){
  if(week<1)return {key:"foundation",name:"Pre-start",short:"Pre",pre:true};
  if(week<=2)return {key:"foundation",name:"Foundation",short:"Found."};
  if(week<=6)return {key:"build",name:"Build",short:"Build"};
  if(week===7)return {key:"deload",name:"Deload",short:"Deload"};
  if(week<=12)return {key:"strength",name:"Strength",short:"Strength"};
  if(week===13)return {key:"test",name:"Test & Review",short:"Test"};
  var c=Math.floor((week-14)/9)+2, w=(week-14)%9+1;
  if(w<=4)return {key:"volume",name:"Cycle "+c+" · Volume",short:"Vol",cycle:c};
  if(w<=8)return {key:"strength",name:"Cycle "+c+" · Strength",short:"Strength",cycle:c};
  return {key:"deload",name:"Cycle "+c+" · Deload",short:"Deload",cycle:c};
}
function phaseFor(s){return phaseOf(weekOf(s));}

function lastTime(exId,before,skipDeload){
  var ds=sortedLogDates();
  for(var i=ds.length-1;i>=0;i--){
    var d=ds[i]; if(d>=before)continue;
    if(skipDeload&&phaseFor(d).key==="deload")continue;
    var e=state.logs[d].ex&&state.logs[d].ex[exId];
    if(e&&e.sets&&e.sets.some(function(x){return x&&x.d;}))return {date:d,sets:e.sets.filter(function(x){return x&&x.d;}),top:e.top};
  }
  return null;
}
function suggest(exId,s){
  var ex=EX[exId], tg=targetFor(exId,s), ph=phaseFor(s);
  var lt=lastTime(exId,s,ph.key!=="deload");
  if(!lt)return {w:ex.start,note:ex.bw?(ex.start?"":"Bodyweight"):"Starting point. Adjust so the last 2 reps feel hard.",fresh:true};
  var topW=Math.max.apply(null,lt.sets.map(function(x){return +x.w||0;}));
  if(ex.bw&&topW===0){
    var hitBw=lt.sets.every(function(x){return x.r>=(lt.top||tg.hi);});
    return {w:0,note:hitBw&&ex.k!=="core"?"You hit every rep last time. Make it a little harder.":"",up:hitBw&&ex.k!=="core"};
  }
  if(ex.k==="core"||!ex.inc)return {w:topW,note:""};
  if(ph.key==="deload")return {w:roundTo(topW*0.7,ex.inc),note:"Deload: about 70% of your usual weight"};
  var hit=lt.sets.length>=1&&lt.sets.every(function(x){return x.r>=(lt.top||tg.hi);});
  if(!lt.top||lt.top===tg.hi){
    if(hit)return {w:topW+ex.inc,note:"Every rep hit last time. Add "+ex.inc+" lb.",up:true};
    return {w:topW,note:"Same weight. Try to beat last time's reps."};
  }
  var best=Math.max.apply(null,lt.sets.map(function(x){return e1rm(+x.w||0,+x.r||0);}));
  return {w:roundTo(best/(1+tg.hi/30),ex.inc),note:"New rep range, so the weight is adjusted."};
}

  saveTimer=setTimeout(publishNow,delay==null?6000:delay);
}
function publishNow(){
  clearTimeout(saveTimer);
  if(!artifactNS||!dirty)return;
  dirty=false; stashUI();
  artifactNS.publish(buildHTML()).then(function(){ /* the view reloads to the new version */ })
  .catch(function(err){
    var c=err&&err.code;
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){artifactNS=null;sync="local";}
    else if(c==="conflict"){/* a newer version is loading */}
    else {sync="local";}
    paintSync();
  });
}
function paintSync(){
  var el=document.getElementById("sync");if(!el)return;
  var map={ok:["ok","Synced"],busy:["busy","Saving…"],local:["","Saved on this device"],pending:["",""]};

function liftHTML(exId){

var restEnd=0, timerInt=null;

function startRest(sec){restEnd=Date.now()+sec*1000;try{sessionStorage.setItem("strongBrief_rest",String(restEnd));}catch(e){}paintTimer();}

function paintTimer(){
  var slot=document.getElementById("timer-slot");if(!slot)return;
  clearInterval(timerInt);
  if(!restEnd||Date.now()-restEnd>8000){slot.innerHTML="";restEnd=0;return;}
  function tick(){var left=Math.round((restEnd-Date.now())/1000);
    if(left<-8){stopRest();return;}
    var z=left<=0, m=Math.floor(Math.max(0,left)/60), s=Math.max(0,left)%60;
    slot.innerHTML='<div class="timer'+(z?' zero':'')+'" role="timer"><span>'+(z?'Next set':'Rest')+'</span><span class="num">'+m+':'+pad(s)+'</span><button data-a="skiprest">'+(z?'Close':'Skip')+'</button></div>';}
  tick(); timerInt=setInterval(tick,1000);
}
